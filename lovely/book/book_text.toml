[manifest]
dump_lua = true
priority = 1
version = "1.0.0"

# Book text ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''--check if fish has been caught already. if this is the first time, go to rodney's words of wisdom.'''
payload = '''
if self.caughtFish == 'more_fish_book' then
	self.rodneyText = loc.get('fish_more_fish_book_description')
	self.rodneyTextY = 52
	startFade = true
else'''
position = "before"
target = "states/Fishing.lua"
times = 1

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''
end

if startFade then'''
payload = '''
	end
end
if startFade then'''
position = "at"
target = "states/Fishing.lua"
times = 1