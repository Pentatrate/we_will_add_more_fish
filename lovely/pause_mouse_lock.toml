[manifest]
dump_lua = true
priority = 1
version = "1.0.0"

# Pause Mouse lock fix ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''self.pauseMenu.menu:resetMenus()'''
payload = '''love.mouse.setGrabbed(false)'''
position = "before"
target = "states/Fishing.lua"
times = 1

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''self.pauseMenu:stopPause()'''
payload = '''if savedata.options.game.lockMouseToWindow then love.mouse.setGrabbed(true) end'''
position = "after"
target = "states/Fishing.lua"
times = 1

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''self.viewingBook = true'''
payload = '''love.mouse.setGrabbed(false)'''
position = "after"
target = "states/Fishing.lua"
times = 1

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''log('resetting fishing state...')'''
payload = '''if savedata.options.game.lockMouseToWindow then love.mouse.setGrabbed(true) end'''
position = "after"
target = "states/Fishing.lua"
times = 1
